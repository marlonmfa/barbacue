# Serviço independente no host atual do Barbacue; banco nativo preservado.
name: barbacue-ifood
services:
  monitor:
    image: barbacue-ifood:20261018
    restart: unless-stopped
    init: true
    network_mode: host
    env_file: .env
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "const h=JSON.parse(require('fs').readFileSync('/tmp/ifood-health.json','utf8'));process.exit(Date.now()-(h.state==='waiting_authorization'?h.lastCheck:h.lastSuccess)<300000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
