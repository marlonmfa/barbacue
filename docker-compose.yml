services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Host 5437 → container 5432 (avoids clashing with a host Postgres on 5432).
      # Internal services reach it as "postgres:5432" regardless of this mapping.
      - "5437:5432"
    environment:
      POSTGRES_USER: barbacue
      POSTGRES_PASSWORD: barbacue
      POSTGRES_DB: barbacue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbacue"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies drizzle migrations, then exits. `web` waits for it.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://barbacue:barbacue@postgres:5432/barbacue
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Container-internal DB host is the service name "postgres".
      DATABASE_URL: postgresql://barbacue:barbacue@postgres:5432/barbacue
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DOMAIN_BARBA: ${DOMAIN_BARBA:-barbacue.cog.ia.br}
      DOMAIN_CHELAS: ${DOMAIN_CHELAS:-chelas.hirableaiagents.com}
      DOMAIN_HOTDOG: ${DOMAIN_HOTDOG:-barbadog.hirableaiagents.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET}
      ADMIN_MASTER_PASSWORD: ${ADMIN_MASTER_PASSWORD}
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-}
      DELIVERY_NOMINATIM_URL: ${DELIVERY_NOMINATIM_URL:-}
      DELIVERY_OSRM_URL: ${DELIVERY_OSRM_URL:-}
      DELIVERY_OSM_USER_AGENT: ${DELIVERY_OSM_USER_AGENT:-}
      DELIVERY_PROVIDER_TIMEOUT_MS: ${DELIVERY_PROVIDER_TIMEOUT_MS:-8000}
      # Lets the admin panel proxy the bot's pairing status, and lets the bot
      # call the protected order-history endpoint.
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BOT_STATUS_URL: http://whatsapp-bot:3001
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Long-running WhatsApp ordering bot (Baileys). Bridges WhatsApp ↔ web API.
  whatsapp-bot:
    build:
      context: ./apps/whatsapp-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEB_BASE_URL: http://web:3000
      # Customer-facing links sent over WhatsApp must use the public URL.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BOT_PORT: "3001"
      SESSIONS_DIR: /app/sessions
      APP_DEEPLINK_BASE: ${APP_DEEPLINK_BASE:-}
    volumes:
      # Persist the WhatsApp pairing so it survives restarts (scan QR once).
      - whatsapp_sessions:/app/sessions
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  whatsapp_sessions:
