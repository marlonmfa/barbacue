services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Host 5437 → container 5432 (avoids clashing with a host Postgres on 5432).
      # Internal services reach it as "postgres:5432" regardless of this mapping.
      - "5437:5432"
    environment:
      POSTGRES_USER: barbacue
      POSTGRES_PASSWORD: barbacue
      POSTGRES_DB: barbacue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbacue"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies drizzle migrations, then exits. `web` waits for it.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://barbacue:barbacue@postgres:5432/barbacue
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Container-internal DB host is the service name "postgres".
      DATABASE_URL: postgresql://barbacue:barbacue@postgres:5432/barbacue
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DOMAIN_BARBA: ${DOMAIN_BARBA:-barbacue.cog.ia.br}
      DOMAIN_CHELAS: ${DOMAIN_CHELAS:-chelas.hirableaiagents.com}
      DOMAIN_HOTDOG: ${DOMAIN_HOTDOG:-barbadog.hirableaiagents.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET}
      ADMIN_MASTER_PASSWORD: ${ADMIN_MASTER_PASSWORD}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      # Login social dos clientes (docs/LOGIN-SOCIAL.md)
      APP_URL: ${APP_URL:-https://barbacue.cog.ia.br}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-}
      DELIVERY_NOMINATIM_URL: ${DELIVERY_NOMINATIM_URL:-}
      DELIVERY_OSRM_URL: ${DELIVERY_OSRM_URL:-}
      DELIVERY_OSM_USER_AGENT: ${DELIVERY_OSM_USER_AGENT:-}
      DELIVERY_PROVIDER_TIMEOUT_MS: ${DELIVERY_PROVIDER_TIMEOUT_MS:-8000}
      # Lets the admin panel proxy the bot's pairing status, and lets the bot
      # call the protected order-history endpoint.
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BOT_STATUS_URL: http://whatsapp-bot:3001
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Ativar explicitamente após autorizar as três lojas no iFood Developer.
  ifood-monitor:
    profiles: [ifood]
    build:
      context: .
      dockerfile: packages/ifood/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://barbacue:barbacue@postgres:5432/barbacue
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID:-}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET:-}
      IFOOD_MERCHANTS_JSON: ${IFOOD_MERCHANTS_JSON:-}
      IFOOD_MERCHANT_ID: ${IFOOD_MERCHANT_ID:-}
      IFOOD_BRAND: ${IFOOD_BRAND:-barbacue}
      IFOOD_POLL_INTERVAL_MS: ${IFOOD_POLL_INTERVAL_MS:-30000}
      IFOOD_DRY_RUN: ${IFOOD_DRY_RUN:-true}
      IFOOD_AUTO_CONFIRM: ${IFOOD_AUTO_CONFIRM:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/ifood-health.json','utf8'));process.exit(Date.now()-(h.state==='waiting_authorization'?h.lastCheck:h.lastSuccess)<300000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Long-running WhatsApp ordering bot. WhatsApp transport is owned by zap.cog.ia.br.
  whatsapp-bot:
    build:
      context: ./apps/whatsapp-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEB_BASE_URL: http://web:3000
      # Customer-facing links sent over WhatsApp must use the public URL.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      BOT_PORT: "3001"
      SESSIONS_DIR: /app/sessions
      APP_DEEPLINK_BASE: ${APP_DEEPLINK_BASE:-}
      ZAP_API_BASE_URL: ${ZAP_API_BASE_URL:-https://zap.cog.ia.br/api/v1}
      ZAP_API_TOKEN: ${ZAP_API_TOKEN:-}
      ZAP_SESSION_ID: ${ZAP_SESSION_ID:-}
      ZAP_WEBHOOK_SECRET: ${ZAP_WEBHOOK_SECRET:-}
      ZAP_WEBHOOK_URL: ${ZAP_WEBHOOK_URL:-https://barbacue.cog.ia.br/api/webhooks/zap}
    volumes:
      # Retained for compatibility; pairing state is maintained by Zap.
      - whatsapp_sessions:/app/sessions
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  whatsapp_sessions:
