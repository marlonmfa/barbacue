name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run desktop:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-FileHash apps/desktop/release/*Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content apps/desktop/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Barbacue-Pedidos-Windows
          path: |
            apps/desktop/release/*Setup.exe
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/INSTALAR.md
          if-no-files-found: error
