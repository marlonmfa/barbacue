name: barbacue
description: "Lanches do Barba — cardápio e pedidos"
publish_to: 'none'

version: 1.2.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & networking
  http: ^1.2.2

  # State management (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage (cart persistence)
  shared_preferences: ^2.5.3

  # Images with cache
  cached_network_image: ^3.4.1

  # JSON serialization
  json_annotation: ^4.9.0

  # URL launcher (WhatsApp)
  url_launcher: ^6.3.1

  # Pix QR Code rendering (payment screen)
  qr_flutter: ^4.1.0
  intl: ^0.20.3

  # WhatsApp/Instagram brand glyphs. The exact SVG paths the web hero ships are
  # inlined as strings, so the two clients draw the same marks without pulling in
  # a whole icon font for two icons.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.3

  # Gives cached_network_image's disk cache a working sqflite under flutter_test.
  # The menu screenshot renders real ProductCards, which reach for the cache the
  # moment a card has a fallback image; without this the widget test dies on
  # "databaseFactory not initialized" instead of rendering.
  sqflite_common_ffi: ^2.4.0+3

  # flutter_native_splash: only needed to (re)generate the native splash assets,
  # which are already committed (res/drawable*/launch_background.xml, iOS
  # LaunchImage). Keeping it as a runtime dep broke the release build because its
  # GeneratedPluginRegistrant entry references a class the package no longer ships.
  # To regenerate splash assets: temporarily re-add it, run
  # `dart run flutter_native_splash:create`, then remove it again.

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/brand/

  # Anton (OFL) is the web's display face for the wordmark and the category
  # headings (globals.css .section-title, loaded there via next/font/google).
  # Bundling the same TTF keeps the headings identical across clients; the
  # alternative — approximating it with a condensed system weight — drifts per
  # device, and the family ships a single 400 weight, so heading styles set
  # fontFamily only and never a fontWeight.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # White adaptive background matches the barbacue-icon's own white field, so the
  # red-on-white logo reads the same on iOS (rounded white square) and Android
  # (masked white circle/squircle). The foreground logo is pre-padded into the
  # safe zone so the "ESDT. 2019" edge text is never clipped by the mask.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  # White splash to match the red-on-white brand (was amber #F59E0B).
  color: "#FFFFFF"
  image: assets/splash/logo.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/splash/logo.png
